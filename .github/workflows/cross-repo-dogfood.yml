name: Cross-Repository Dogfood Proof

on:
  pull_request:
    paths:
      - 'src/arcade_agent/ci/**'
      # Parser changes can alter graph metrics and false-positive rates.
      - 'src/arcade_agent/parsers/**'
      - 'tests/test_parsers/**'
      - 'src/arcade_agent/algorithms/concern.py'
      - 'src/arcade_agent/algorithms/coupling.py'
      - 'src/arcade_agent/algorithms/smells.py'
      - 'tests/test_algorithms/test_non_scoring_candidates.py'
      - 'src/arcade_agent/tools/detect_smells.py'
      - 'tests/test_algorithms/test_concern_scatter_evidence.py'
      - 'tests/test_source_provenance.py'
      - '.github/scripts/verify_dogfood_proof.py'
      - 'tests/test_verify_dogfood_proof.py'
      - '.github/workflows/cross-repo-dogfood.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: tuannx/spring-boot-multi-region-ha
      TARGET_SHA: 5a4ba4d33dfd88a90fd6ec749894fd0088baf1d9
      TARGET_PATH: target-java
      TARGET_LANGUAGE: java
    steps:
      - name: Checkout analyzer under review
        uses: actions/checkout@v4
        with:
          path: analyzer

      - name: Checkout pinned public Java HA repository
        uses: actions/checkout@v4
        with:
          repository: tuannx/spring-boot-multi-region-ha
          ref: 5a4ba4d33dfd88a90fd6ec749894fd0088baf1d9
          path: target-java
          persist-credentials: false

      - name: Verify checkout identities
        run: |
          test "$(git -C target-java rev-parse HEAD)" = "$TARGET_SHA"
          git -C analyzer rev-parse HEAD
          git -C target-java rev-parse HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer from this PR
        run: python -m pip install "./analyzer[languages]"

      - name: Run pinned Java architecture analysis
        id: analysis
        run: |
          arcade-self-analysis \
            --source "$TARGET_PATH" \
            --language "$TARGET_LANGUAGE" \
            --repo-name "$TARGET_REPOSITORY" \
            --expected-source-sha "$TARGET_SHA" \
            --output-json java-ha-analysis.json \
            --output-html java-ha-report.html

      - name: Assert target Git provenance is not analyzer provenance
        if: steps.analysis.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("java-ha-analysis.json").read_text())
          assert data["repo_name"] == os.environ["TARGET_REPOSITORY"]
          assert data["commit_sha"] == os.environ["TARGET_SHA"]
          assert data["analyzer_commit_sha"] == os.environ["GITHUB_SHA"]
          assert data["source_ref"] == "commit:" + os.environ["TARGET_SHA"]
          print("PASS: source and analyzer commit identities are distinct and correct")
          print({key: data[key] for key in ("num_entities", "num_edges", "num_components")})
          PY

      - name: Capture screenshot from the actual generated report
        id: screenshot
        if: steps.analysis.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(Path("java-ha-report.html").resolve().as_uri())
              page.screenshot(path="java-ha-actual-screenshot.png", full_page=False)
              browser.close()
          image = Path("java-ha-actual-screenshot.png").read_bytes()
          assert image.startswith(b"\x89PNG\r\n\x1a\n") and len(image) > 2048
          print("Screenshot captured from real report HTML")
          PY

      - name: Record reproducible evidence and gaps
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          SCREENSHOT_OUTCOME: ${{ steps.screenshot.outcome }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          file = Path("java-ha-analysis.json")
          data = json.loads(file.read_text()) if file.is_file() else {}
          screenshot = Path("java-ha-actual-screenshot.png")
          proof = {
              "target_repository": os.environ["TARGET_REPOSITORY"],
              "target_commit_sha_expected": os.environ["TARGET_SHA"],
              "target_commit_sha_reported": data.get("commit_sha"),
              "analyzer_commit_sha": data.get("analyzer_commit_sha", os.environ.get("GITHUB_SHA")),
              "analysis_outcome": os.environ.get("ANALYSIS_OUTCOME", "not-run"),
              "screenshot_outcome": os.environ.get("SCREENSHOT_OUTCOME", "not-run"),
              "screenshot_sha256": hashlib.sha256(screenshot.read_bytes()).hexdigest() if screenshot.is_file() else None,
              "html_report_sha256": hashlib.sha256(Path("java-ha-report.html").read_bytes()).hexdigest() if Path("java-ha-report.html").is_file() else None,
              "num_entities": data.get("num_entities"),
              "num_edges": data.get("num_edges"),
              "num_components": data.get("num_components"),
              "smells_count_heuristic": len(data.get("smells", [])) if data else None,
              "false_positive_review": "not-evaluated",
              "unsupported_construct_review": "not-evaluated",
              "analysis_json_sha256": hashlib.sha256(file.read_bytes()).hexdigest() if file.is_file() else None,
              "ci_url": os.environ["CI_URL"],
          }
          Path("dogfood-proof.json").write_text(json.dumps(proof, indent=2) + "\n")
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload proof bundle even when analysis fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-ha-dogfood-proof
          path: |
            dogfood-proof.json
            java-ha-analysis.json
            java-ha-report.html
            java-ha-actual-screenshot.png
          retention-days: 30
          if-no-files-found: warn

  python-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: tuannx/arcade-agent-examples
      TARGET_SHA: 067be3a83a5e58d4d4a8a72ef578e7f7fa588209
      TARGET_PATH: target-examples/scenarios/synthetic-smells/synthetic/after
    steps:
      - name: Checkout analyzer under review
        uses: actions/checkout@v4
        with:
          path: analyzer
          persist-credentials: false

      - name: Checkout pinned Python corpus
        uses: actions/checkout@v4
        with:
          repository: tuannx/arcade-agent-examples
          ref: 067be3a83a5e58d4d4a8a72ef578e7f7fa588209
          path: target-examples
          persist-credentials: false

      - name: Verify target HEAD
        run: test "$(git -C target-examples rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer from PR source
        run: python -m pip install "./analyzer[languages]"

      - name: Run pinned Python architecture analysis
        id: analysis
        run: |
          arcade-self-analysis \
            --source "$TARGET_PATH" \
            --language python \
            --repo-name "$TARGET_REPOSITORY" \
            --expected-source-sha "$TARGET_SHA" \
            --output-json python-examples-analysis.json \
            --output-html python-examples-report.html

      - name: Verify report provenance and non-empty analysis
        if: steps.analysis.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("python-examples-analysis.json").read_text())
          assert data["repo_name"] == os.environ["TARGET_REPOSITORY"]
          assert data["commit_sha"] == os.environ["TARGET_SHA"]
          assert data["source_ref"] == "commit:" + os.environ["TARGET_SHA"]
          assert data["analyzer_commit_sha"] == os.environ["GITHUB_SHA"]
          assert data["num_entities"] > 0
          assert data["num_components"] > 0
          print({key: data[key] for key in ("num_entities", "num_edges", "num_components")})
          PY

      - name: Screenshot actual HTML report
        id: screenshot
        if: steps.analysis.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(Path("python-examples-report.html").resolve().as_uri())
              page.screenshot(path="python-examples-actual-screenshot.png")
              browser.close()
          image = Path("python-examples-actual-screenshot.png").read_bytes()
          assert image.startswith(bytes.fromhex("89504e470d0a1a0a")) and len(image) > 2048
          PY

      - name: Record proof and explicit gaps
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          report = Path("python-examples-analysis.json")
          screenshot = Path("python-examples-actual-screenshot.png")
          data = json.loads(report.read_text()) if report.is_file() else {}
          proof = {
              "target_repository": os.environ["TARGET_REPOSITORY"],
              "target_commit_sha_expected": os.environ["TARGET_SHA"],
              "target_commit_sha_reported": data.get("commit_sha"),
              "analyzer_commit_sha": data.get("analyzer_commit_sha", os.environ.get("GITHUB_SHA")),
              "analysis_outcome": "success" if data else "failed-or-not-run",
              "screenshot_outcome": "success" if screenshot.is_file() else "failed-or-not-run",
              "analysis_json_sha256": hashlib.sha256(report.read_bytes()).hexdigest() if report.is_file() else None,
              "screenshot_sha256": hashlib.sha256(screenshot.read_bytes()).hexdigest() if screenshot.is_file() else None,
              "html_report_sha256": hashlib.sha256(Path("python-examples-report.html").read_bytes()).hexdigest() if Path("python-examples-report.html").is_file() else None,
              "num_entities": data.get("num_entities"),
              "num_edges": data.get("num_edges"),
              "num_components": data.get("num_components"),
              "smells_count_heuristic": len(data.get("smells", [])) if data else None,
              "false_positive_review": "not-evaluated",
              "unsupported_construct_review": "not-evaluated",
              "ci_url": "/".join([
                  os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
                  os.environ["GITHUB_REPOSITORY"],
                  "actions/runs", os.environ["GITHUB_RUN_ID"],
              ]),
          }
          Path("python-examples-proof.json").write_text(json.dumps(proof, indent=2) + "\n")
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload Python proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-examples-dogfood-proof
          path: |
            python-examples-proof.json
            python-examples-analysis.json
            python-examples-report.html
            python-examples-actual-screenshot.png
          retention-days: 30
          if-no-files-found: warn

  # Independent verifier runs on a separate clean runner. It downloads the
  # producer artifact and reruns the analyzer from a fresh pinned checkout.
  # The verifier never treats heuristic warnings as confirmed violations.
  verify-proofs:
    needs: [java-ha, python-examples]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: java
            artifact: java-ha-dogfood-proof
            repository: tuannx/spring-boot-multi-region-ha
            sha: 5a4ba4d33dfd88a90fd6ec749894fd0088baf1d9
            checkout_path: target-java
            source_path: target-java
            language: java
            proof: dogfood-proof.json
            report: java-ha-analysis.json
            html: java-ha-report.html
            screenshot: java-ha-actual-screenshot.png
          - corpus: python
            artifact: python-examples-dogfood-proof
            repository: tuannx/arcade-agent-examples
            sha: 067be3a83a5e58d4d4a8a72ef578e7f7fa588209
            checkout_path: target-examples
            source_path: target-examples/scenarios/synthetic-smells/synthetic/after
            language: python
            proof: python-examples-proof.json
            report: python-examples-analysis.json
            html: python-examples-report.html
            screenshot: python-examples-actual-screenshot.png
    steps:
      - name: Independently checkout analyzer under review
        uses: actions/checkout@v4
        with:
          path: analyzer
          persist-credentials: false

      - name: Independently checkout the pinned source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: ${{ matrix.checkout_path }}
          persist-credentials: false

      - name: Verify replay checkout provenance
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          CHECKOUT_PATH: ${{ matrix.checkout_path }}
        run: |
          test "$(git -C "$CHECKOUT_PATH" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$CHECKOUT_PATH" status --porcelain --untracked-files=all)"

      - name: Download producer artifacts to a separate runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: producer-proof

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install same analyzer from pinned PR checkout
        run: python -m pip install "./analyzer[languages]"

      - name: Replay actual analyzer against independent source checkout
        env:
          SOURCE_PATH: ${{ matrix.source_path }}
          SOURCE_LANGUAGE: ${{ matrix.language }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          arcade-self-analysis \
            --source "$SOURCE_PATH" \
            --language "$SOURCE_LANGUAGE" \
            --repo-name "$TARGET_REPOSITORY" \
            --expected-source-sha "$TARGET_SHA" \
            --output-json independent-replay.json \
            --output-html independent-replay.html

      - name: Independently verify artifact hashes, commit SHA and replay
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SHA: ${{ matrix.sha }}
          PROOF: ${{ matrix.proof }}
          REPORT: ${{ matrix.report }}
          HTML: ${{ matrix.html }}
          SCREENSHOT: ${{ matrix.screenshot }}
        run: |
          python analyzer/.github/scripts/verify_dogfood_proof.py \
            --proof "producer-proof/$PROOF" \
            --analysis "producer-proof/$REPORT" \
            --html "producer-proof/$HTML" \
            --screenshot "producer-proof/$SCREENSHOT" \
            --replay independent-replay.json \
            --expected-repo "$TARGET_REPOSITORY" \
            --expected-source-sha "$TARGET_SHA" \
            --expected-analyzer-sha "$GITHUB_SHA" \
            --output verifier-result.json

      - name: Preserve independent verifier results and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-verify-${{ matrix.corpus }}
          path: |
            verifier-result.json
            independent-replay.json
          retention-days: 30
          if-no-files-found: warn
